<app-header></app-header>

<div style="margin-top: 20%;">
  @for (trip of trips; track $index) {
    <mat-card class="trip">
      <p><strong>ID:</strong> {{ trip.id }}</p>
      <p><strong>Conductor:</strong> {{ trip.driverName }}</p>
      <p><strong>Hora de recogida:</strong> {{ trip.pickupTime }}</p>
    </mat-card>
    <br>
  }
</div>
