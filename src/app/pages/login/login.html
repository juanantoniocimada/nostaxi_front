<app-header></app-header>


<div class="page-content">

  <input class="input-field" matInput type="number" placeholder="Phone Number" [(ngModel)]="phoneNumber" />
  <input class="input-field" matInput [type]="passwordVisible ? 'text' : 'password'" placeholder="Password" [(ngModel)]="password" />
  <button type="button" (click)="passwordVisible = !passwordVisible">show password</button>

  <button class="btn-outline" (click)="login()">Login</button>
  <button class="btn-outline" (click)="register()">Register</button>

  <p>Nao recordas a tua palavra-passe?</p>
  <button (click)="forgotPassword()">Recuperar palavra-passe</button>
</div>

  <footer>
    <button (click)="registerDriver()">Sou taxista</button>
    <button (click)="registerEstablishment()">Sou estabelecimento associado</button>
  </footer>
