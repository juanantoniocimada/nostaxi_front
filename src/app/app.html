<mat-sidenav-container class="sidenav-container" >

  <mat-sidenav #sidenav mode="side" [opened]="menu.showMenu()">

    <mat-nav-list class="profile-list">

      <a mat-list-item class="profile-item"  (click)="goTo('/home')">
        <mat-icon>home</mat-icon>
        <span>Inicio</span>
      </a>

      <a mat-list-item class="profile-item" (click)="goTo('/trips')">
        <mat-icon >route</mat-icon>
        <span>Mi perfil</span>
      </a>

      <a mat-list-item class="profile-item" (click)="goTo('/trips')">
        <mat-icon>route</mat-icon>
        <span>Mis viajes</span>
      </a>

      <a mat-list-item class="profile-item" (click)="logout()">
        <mat-icon>route</mat-icon>
        <span>Salir</span>
      </a>

    </mat-nav-list>

  </mat-sidenav>

  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>

</mat-sidenav-container>
