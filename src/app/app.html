<mat-sidenav-container class="sidenav-container" >

  <mat-sidenav #sidenav mode="side" [opened]="menu.showMenu()">

    <mat-nav-list>

      <a mat-list-item (click)="goToHome()">
        <mat-icon>home</mat-icon>
        <span>Inicio</span>
      </a>

      <a mat-list-item routerLink="/trips">
        <mat-icon>route</mat-icon>
        <span>Mi perfil</span>
      </a>

      <a mat-list-item (click)="goToTrips()">
        <mat-icon>route</mat-icon>
        <span>Mis viajes</span>
      </a>

    </mat-nav-list>

  </mat-sidenav>

  <mat-sidenav-content>


    <router-outlet></router-outlet>

    <button style="right: 0;" mat-icon-button (click)="sidenav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>

  </mat-sidenav-content>

</mat-sidenav-container>
